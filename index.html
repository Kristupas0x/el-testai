<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elektrikų testai</title>
<style>
:root{--bg:#f4f1ea;--card:#fffdf8;--ink:#1b1d22;--mut:#6b6f78;--line:#e3ddd0;--ac:#c2410c;--on:#fff;--ok:#15803d;--okb:#dcfce7;--bad:#b91c1c;--badb:#fee2e2;--r:14px}
[data-theme=dark]{--bg:#101216;--card:#181b21;--ink:#ecebe6;--mut:#9a9ea8;--line:#2a2e37;--ac:#ffb454;--on:#1a1100;--ok:#4ade80;--okb:#12301f;--bad:#f87171;--badb:#3a1618}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1,h2,.serif{font-family:"Iowan Old Style",Georgia,serif;letter-spacing:-.01em}
h1{font-size:2rem;margin:0}.sub{color:var(--mut);margin:4px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
button{font:inherit;cursor:pointer;color:var(--ink)}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:10px;padding:12px 20px;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:10px 16px}
.ghost:hover{border-color:var(--ac)}
.icon{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:1.1rem}
details.node{border-top:1px solid var(--line)}details.node:first-child{border-top:0}
details.node details.node{margin-left:18px}
summary{display:flex;align-items:center;gap:10px;padding:10px 4px;cursor:pointer;list-style:none;font-weight:600}
summary::-webkit-details-marker{display:none}
summary::before{content:"›";color:var(--mut);transition:transform .15s;width:12px}
details[open]>summary::before{transform:rotate(90deg)}
summary span,.row span{flex:1}
em{font-style:normal;color:var(--mut);font-size:.85rem;font-weight:400}
.kids{padding:0 0 6px 22px}
.row{display:flex;gap:10px;align-items:center;padding:7px 4px;cursor:pointer}
input[type=checkbox],input[type=radio]{accent-color:var(--ac);width:18px;height:18px;margin:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.opts label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mut)}
select{font:inherit;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{flex:1;flex-direction:row;align-items:center;justify-content:center;gap:6px;padding:9px;cursor:pointer;color:var(--ink)}
.seg label:has(:checked){background:var(--ac);color:var(--on)}.seg input{display:none}
.bars{display:flex;gap:8px;align-items:flex-end;height:80px}
.bars div{flex:1;background:var(--ac);border-radius:6px 6px 0 0;min-height:4px;position:relative;opacity:.85}
.bars span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:.7rem;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1}.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:14px;font-size:.9rem;color:var(--mut)}
.clock{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.layout{display:grid;grid-template-columns:1fr 230px;gap:16px;align-items:start}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
.q{font-size:1.3rem;line-height:1.4;margin:6px 0 16px}
.tp{font-size:.78rem;color:var(--ac);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.hint{color:var(--mut);font-size:.88rem;margin:-8px 0 12px}
#img img{max-width:100%;max-height:340px;border-radius:10px;background:#fff;display:block;margin-bottom:14px}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:none;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;align-items:flex-start}
.opt b{min-width:26px;height:26px;border-radius:7px;background:var(--line);display:grid;place-items:center;font-size:.8rem}
.opt:hover{border-color:var(--ac)}.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.bad{border-color:var(--bad);background:var(--badb)}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:8px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px;max-height:340px;overflow:auto;margin-bottom:12px}
.map button{height:36px;border-radius:8px;border:1px solid var(--line);background:none;font-size:.8rem}
.map .ans{background:var(--line)}.map .ok{background:var(--okb);border-color:var(--ok)}.map .bad{background:var(--badb);border-color:var(--bad)}
.map .flag{box-shadow:inset 0 -3px var(--ac)}.map .cur{outline:2px solid var(--ac);outline-offset:1px}
.ring{--p:0;width:150px;height:150px;border-radius:50%;margin:20px auto;display:grid;place-items:center;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--line) 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:700 2rem Georgia,serif}
.center{text-align:center}.row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">

<section id="home" class="screen">
  <div class="top">
    <div><h1>Elektrikų testai</h1><p class="sub" id="status">Kraunami klausimai…</p></div>
    <button class="icon" id="theme" title="Šviesi / tamsi tema">◐</button>
  </div>
  <div class="card"><h3>1. Ką mokysimės</h3>
    <div id="tree"></div>
    <div class="row2" style="justify-content:space-between;margin-top:10px">
      <span id="sel" class="sub">Pasirinkite bent vieną temą</span>
      <span><button class="ghost" id="all">Viskas</button> <button class="ghost" id="none">Išvalyti</button></span>
    </div>
  </div>
  <div class="card"><h3>2. Nustatymai</h3>
    <div class="opts">
      <label>Režimas<div class="seg">
        <label><input type="radio" name="mode" value="practice" checked>Mokymasis</label>
        <label><input type="radio" name="mode" value="exam">Egzaminas</label></div></label>
      <label>Klausimų<select id="cnt"><option>10</option><option selected>30</option><option>50</option><option>100</option><option value="all">Visi</option></select></label>
      <label>Laikas (egzaminui)<select id="mins"><option value="0">Be laiko</option><option>10</option><option selected>30</option><option>60</option></select></label>
      <label>Atsakymų tvarka<select id="shuf"><option value="0">Kaip faile</option><option value="1">Maišyti</option></select></label>
    </div>
  </div>
  <button class="btn" id="start" style="width:100%;font-size:1.1rem" disabled>Pradėti</button>
  <div class="card" id="histcard" style="margin-top:16px" hidden><h3>Paskutiniai bandymai</h3><div class="bars" id="hist"></div></div>
</section>

<section id="test" class="screen" hidden>
  <div class="hd"><span id="qn"></span><div class="bar"><i id="bar"></i></div><span class="clock" id="clock"></span></div>
  <div class="layout">
    <div class="card">
      <div class="tp" id="topic"></div><div id="img"></div>
      <h2 class="q serif" id="qt"></h2><div class="hint" id="hint">Pažymėkite visus teisingus variantus</div>
      <div id="opts"></div>
      <div class="nav">
        <button class="ghost" id="prev">← Atgal</button>
        <button class="ghost" id="flag">🚩 Atidėti</button>
        <button class="btn" id="check">Patikrinti</button>
        <button class="ghost" id="next">Pirmyn →</button>
      </div>
    </div>
    <div class="card"><h3>Klausimai</h3><div class="map" id="map"></div>
      <button class="btn" id="finish" style="width:100%">Baigti testą</button></div>
  </div>
</section>

<section id="result" class="screen center" hidden>
  <h2 class="serif" style="font-size:1.8rem;margin-top:30px">Rezultatas</h2>
  <div class="ring" id="ring"><div id="pct">0%</div></div>
  <p id="res" class="sub"></p>
  <div class="row2" style="margin-top:24px">
    <button class="btn" id="rev">Peržiūrėti atsakymus</button>
    <button class="btn" id="retry">Kartoti klaidas</button>
    <button class="ghost" id="back">Į pradžią</button>
  </div>
</section>

</div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const DEF='Bendri klausimai';
let SUBJ=[],T=null,timer=null;

/* ---------- Pagalbinės ---------- */
const show=id=>$$('.screen').forEach(s=>s.hidden=s.id!==id);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const theme=t=>{document.documentElement.dataset.theme=t;LS.set('etest.theme',t)};
$('#theme').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');
theme(LS.get('etest.theme',matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));

/* ---------- Duomenų įkėlimas: data/manifest.json -> kiekvieno dalyko failas ---------- */
(async function init(){
  try{
    const m=await (await fetch('data/manifest.json')).json();
    SUBJ=await Promise.all(m.subjects.map(async s=>{
      const qs=await (await fetch('data/'+s.file)).json();
      qs.forEach(q=>q.tema=q.tema||DEF);
      return {...s,qs,topics:[...new Set(qs.map(q=>q.tema))]};
    }));
    $('#status').textContent=`Užkrauta ${SUBJ.reduce((n,s)=>n+s.qs.length,0)} klausimų iš ${SUBJ.length} dalykų`;
    renderTree();renderHist();
  }catch(e){
    $('#status').innerHTML='Nepavyko užkrauti klausimų. Atidarykite per serverį (pvz. <code>python3 -m http.server</code>), ne tiesiai iš failo. <code>'+esc(e.message)+'</code>';
  }
})();

/* ---------- Temų medis (dalykas → grupė → tema), viskas iš manifest ir JSON ---------- */
const cnt=(s,ts)=>s.qs.filter(q=>ts.includes(q.tema)).length;
const row=(s,t)=>`<label class="row"><input type="checkbox" class="t" data-s="${esc(s.id)}" data-t="${esc(t)}"><span>${esc(t)}</span><em>${cnt(s,[t])}</em></label>`;
const node=(title,n,inner,open)=>`<details class="node"${open?' open':''}><summary><input type="checkbox" class="p"><span>${esc(title)}</span><em>${n} kl.</em></summary><div class="kids">${inner}</div></details>`;
function renderTree(){
  $('#tree').innerHTML=SUBJ.map(s=>{
    const used=new Set();
    let inner=(s.groups||[]).map(g=>{
      const ts=g.topics.filter(t=>s.topics.includes(t));ts.forEach(t=>used.add(t));
      return ts.length?node(g.title,cnt(s,ts),ts.map(t=>row(s,t)).join('')):'';
    }).join('');
    inner+=s.topics.filter(t=>!used.has(t)).map(t=>row(s,t)).join('');
    return node(s.title,s.qs.length,inner);
  }).join('');
  sync();
}
$('#tree').onchange=e=>{
  const c=e.target;
  if(c.classList.contains('p'))c.closest('.node').querySelectorAll('input').forEach(i=>i.checked=c.checked);
  sync();
};
const setAll=v=>{$$('#tree input').forEach(i=>i.checked=v);sync()};
$('#all').onclick=()=>setAll(true);$('#none').onclick=()=>setAll(false);
function sync(){
  $$('#tree .node').reverse().forEach(n=>{
    const p=n.querySelector(':scope>summary>.p'),ts=[...n.querySelectorAll('input.t')],k=ts.filter(i=>i.checked).length;
    p.checked=k>0&&k===ts.length;p.indeterminate=k>0&&k<ts.length;
  });
  const n=getPool().length;
  $('#sel').textContent=n?`Pasirinkta ${n} klausimų`:'Pasirinkite bent vieną temą';
  $('#start').disabled=!n;
}
const getPool=()=>$$('#tree input.t:checked').flatMap(i=>{
  const s=SUBJ.find(x=>x.id===i.dataset.s);
  return s.qs.filter(q=>q.tema===i.dataset.t);
});

/* ---------- Testo eiga ---------- */
function begin(list,mode,mins,mix){
  const qs=list.map(q=>{
    let o=q.atsakymai.map((_,i)=>i);
    if(mix&&!q.vaizdas)o=shuffle(o);
    return {...q,o,multi:q.teisingas.length>1};
  });
  T={qs,ans:qs.map(()=>[]),flag:qs.map(()=>false),lock:qs.map(()=>false),i:0,mode,left:mins*60,done:false};
  clearInterval(timer);
  const timed=mode==='exam'&&mins>0;
  $('#clock').hidden=!timed;
  if(timed){tick();timer=setInterval(tick,1000)}
  show('test');draw();
}
$('#start').onclick=()=>{
  const pool=shuffle(getPool()),v=$('#cnt').value,n=v==='all'?pool.length:Math.min(+v,pool.length);
  begin(pool.slice(0,n),$('input[name=mode]:checked').value,+$('#mins').value,$('#shuf').value==='1');
};
function tick(){
  if(T.left<=0){finish(true);return}
  $('#clock').textContent=`${String(T.left/60|0).padStart(2,'0')}:${String(T.left%60).padStart(2,'0')}`;
  T.left--;
}
const isOk=k=>{const a=T.ans[k],t=T.qs[k].teisingas;return a.length===t.length&&t.every(x=>a.includes(x))};
function draw(){
  const i=T.i,q=T.qs[i],locked=T.done||T.lock[i];
  $('#qn').textContent=`${i+1} / ${T.qs.length}`;
  $('#bar').style.width=T.ans.filter(a=>a.length).length/T.qs.length*100+'%';
  $('#topic').textContent=q.tema===DEF?'':q.tema;
  $('#img').innerHTML=q.vaizdas?`<img src="${esc(q.vaizdas)}" alt="Iliustracija">`:'';
  $('#qt').textContent=q.klausimas;
  $('#hint').hidden=!q.multi;
  $('#opts').innerHTML=q.o.map((oi,k)=>{
    const sel=T.ans[i].includes(oi),ok=q.teisingas.includes(oi);
    const c='opt'+(sel?' sel':'')+(locked?(ok?' ok':sel?' bad':''):'');
    return `<button class="${c}" data-o="${oi}"><b>${k+1}</b><span>${esc(q.atsakymai[oi])}</span></button>`;
  }).join('');
  $('#check').hidden=!(T.mode==='practice'&&q.multi&&!locked);
  $('#flag').hidden=T.done;$('#flag').textContent=T.flag[i]?'🚩 Atžymėti':'🚩 Atidėti';
  $('#prev').disabled=i===0;$('#next').disabled=i===T.qs.length-1;
  $('#finish').textContent=T.done?'Į rezultatą':'Baigti testą';
  $('#map').innerHTML=T.qs.map((_,k)=>{
    let c=T.done||T.lock[k]?(isOk(k)?'ok':'bad'):T.ans[k].length?'ans':'';
    if(T.flag[k])c+=' flag';if(k===i)c+=' cur';
    return `<button class="${c}" data-k="${k}">${k+1}</button>`;
  }).join('');
  $('#map .cur')?.scrollIntoView({block:'nearest'});
}
function pick(o){
  if(T.done||T.lock[T.i])return;
  const q=T.qs[T.i],a=T.ans[T.i];
  if(q.multi)T.ans[T.i]=a.includes(o)?a.filter(x=>x!==o):[...a,o];
  else{T.ans[T.i]=[o];if(T.mode==='practice')T.lock[T.i]=true}
  draw();
}
const go=d=>{const n=T.i+d;if(n>=0&&n<T.qs.length){T.i=n;draw()}};
$('#opts').onclick=e=>{const b=e.target.closest('.opt');if(b)pick(+b.dataset.o)};
$('#map').onclick=e=>{const b=e.target.closest('button');if(b){T.i=+b.dataset.k;draw()}};
$('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);
$('#flag').onclick=()=>{T.flag[T.i]=!T.flag[T.i];draw()};
$('#check').onclick=()=>{if(T.ans[T.i].length){T.lock[T.i]=true;draw()}};
$('#finish').onclick=()=>T.done?show('result'):finish();
document.addEventListener('keydown',e=>{
  if($('#test').hidden||e.target.matches('select,input'))return;
  if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else if(/^[1-9]$/.test(e.key)){const o=T.qs[T.i].o[+e.key-1];if(o!==undefined)pick(o)}
});

/* ---------- Rezultatai ---------- */
function finish(force){
  const un=T.ans.filter(a=>!a.length).length;
  if(!force&&un&&!confirm(`Neatsakyta klausimų: ${un}. Baigti testą?`))return;
  clearInterval(timer);T.done=true;
  const ok=T.qs.filter((_,k)=>isOk(k)).length,n=T.qs.length,pct=Math.round(ok/n*100);
  LS.set('etest.hist',[...LS.get('etest.hist',[]),{t:Date.now(),pct,ok,n,mode:T.mode}].slice(-8));
  $('#pct').textContent=pct+'%';$('#ring').style.setProperty('--p',pct);
  $('#res').textContent=`${ok} iš ${n} atsakyta teisingai`;
  $('#retry').hidden=ok===n;
  show('result');
}
$('#rev').onclick=()=>{const w=T.qs.findIndex((_,k)=>!isOk(k));T.i=w<0?0:w;show('test');draw()};
$('#retry').onclick=()=>begin(T.qs.filter((_,k)=>!isOk(k)),'practice',0,false);
$('#back').onclick=()=>{clearInterval(timer);renderHist();show('home')};
function renderHist(){
  const h=LS.get('etest.hist',[]);
  $('#histcard').hidden=!h.length;
  $('#hist').innerHTML=h.map(x=>`<div style="height:${Math.max(x.pct,4)}%" title="${new Date(x.t).toLocaleString('lt')} · ${x.ok}/${x.n}"><span>${x.pct}%</span></div>`).join('');
}
</script>
</body>
</html>
